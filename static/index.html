<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orchard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="mobile-header">
      <button id="menu-btn" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <button id="mobile-back" class="hidden" aria-label="Go back">&larr;</button>
      <div class="mobile-title">Orchard</div>
    </header>
    <nav id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title-row">
          <h1>Orchard</h1>
          <button id="theme-toggle" aria-label="Toggle theme"></button>
        </div>
        <form id="search-form" action="#" role="search">
          <input type="search" id="search" placeholder="Search products..." autocomplete="off">
        </form>
      </div>
      <ul id="sidebar-list"></ul>
    </nav>
    <div id="sidebar-overlay"></div>
    <main id="content">
      <div id="connection-error" class="hidden">Unable to reach the server. Check your connection.</div>
      <div id="welcome" class="hidden">
        <h2>Apple Product Database</h2>
        <p>Select a category to browse products.</p>
      </div>
      <div id="items-view" class="hidden">
        <div class="items-header">
          <h2 id="items-title"></h2>
        </div>
        <div id="items-grid"></div>
        <div class="status-bar" id="items-status"></div>
      </div>
      <div id="detail-view" class="hidden">
        <button id="back-btn">&larr; Back</button>
        <div id="detail-content"></div>
      </div>
      <div id="search-results" class="hidden">
        <h2>Search Results</h2>
        <div id="search-grid"></div>
        <div class="status-bar" id="search-status"></div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
