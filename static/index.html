<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mactracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <nav id="sidebar">
      <div class="sidebar-header">
        <h1>Mactracker</h1>
        <input type="search" id="search" placeholder="Search products..." autocomplete="off">
      </div>
      <ul id="sidebar-list"></ul>
    </nav>
    <main id="content">
      <div id="welcome">
        <h2>Apple Product Database</h2>
        <p>Select a category to browse products.</p>
      </div>
      <div id="items-view" class="hidden">
        <div class="items-header">
          <h2 id="items-title"></h2>
          <span id="items-count"></span>
        </div>
        <div id="items-grid"></div>
      </div>
      <div id="detail-view" class="hidden">
        <button id="back-btn">&larr; Back</button>
        <div id="detail-content"></div>
      </div>
      <div id="search-results" class="hidden">
        <h2>Search Results</h2>
        <div id="search-grid"></div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
